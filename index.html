    <h1>눈물이 꽃이 된다</h1>
    <p class="intro">
      흐느끼는 사람의 눈에서 눈물이 흘러내립니다. 눈물은 중력과 바람을 받아
      볼을 타고 떨어지고, 땅에 닿은 바로 그 자리에서 꽃이 피어납니다.
      다 핀 꽃은 꽃가루를 내보내고, 꽃가루도 같은 바람을 타고 흩어집니다.
      <br /><br />
      바람은 <b>마우스의 좌우 위치</b> 또는 <b>← → 방향키</b>로 바꿀 수 있습니다.
      바람이 바뀌면 눈물이 떨어지는 자리, 꽃이 휘는 방향, 꽃가루의 흐름이
      한꺼번에 달라집니다. 눈물은 화면을 <b>누르고 있는 동안</b>에만 나옵니다.
      <b>R</b> 키로 꽃밭을 비울 수 있습니다.
    </p>
